name: build

# 一条 xmake build 驱动四个工具链各异的产物：icemelt.exe（clang-cl）、WinDisk.sys（WDK）、
# ntfs-3g 工具（mingw-w64 gcc）、KDU（MSVC + MASM）。子工程缺前置时会 skip 并打印原因，
# 所以这里显式断言"落位后的组合是完整的"——否则构建会"成功"但产物不可用。
on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
  pull_request:
  workflow_dispatch:

permissions:
  # action-gh-release 建 draft release 需要写权限；PR（含 fork）拿到的 token 仍是只读的，
  # 而且 release 步骤有 ref_type == 'tag' 的 if 守着，非 tag 运行根本不会走到。
  contents: write

jobs:
  gate:
    # 把 commit 和 tag 一把推（git push origin main v1.2.3 / --follow-tags）时，
    # GitHub 对 main 和 tag 各触发一次 run。这里让 branch 触发的 run 先查
    # HEAD commit 有没有 tag 指中：有 → 跳过整个构建，由 tag run 独占
    # （tag run 是 branch run 的超集：同样的构建 + release draft）。
    # 分开推（先推 main 后打 tag）则两次 run 都是真实需求，不去重。
    name: Deduplicate branch vs tag runs
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push' && github.ref_type == 'branch'
        with:
          fetch-depth: 0 # 拿全部 tag，git tag --points-at 才可靠

      - id: check
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          if git tag --points-at '${{ github.sha }}' | grep -q .; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "commit has a tag; skipping branch build (tag run covers it)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  windows-x64:
    name: icemelt + icemelt-gui + WinDisk.sys + ntfs-3g tools
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: windows-2022
    env:
      # 根 xmake.lua 只在没给出 env 时退回 D:\msys64；GH runner 的 MSYS2 装在 C: 下
      MSYS_ROOT: C:\msys64
      MINGW_ROOT: C:\msys64\mingw64
      # 驱动目标系统版本：win7 → 产物最低子系统版本 6.01，Win7 SP1 起都能加载
      ICEMELT_WDK_WINVER: win7
    steps:
      - name: Checkout (submodules included)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          # 与 xmake.lua 里记录的 v3 约束对齐：v2 没有这些行为（add_requires 必须在根作用域、
          # 没有 check_cxflags/import、get_config 语义不同）
          xmake-version: '3.0.9'

      - name: Install mingw-w64 toolchain (msvcrt, not ucrt64)
        shell: cmd
        run: C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed mingw-w64-x86_64-gcc"

      - name: Put MSYS2 mingw64 on PATH (ahead of the image's own C:\mingw64)
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$($env:MINGW_ROOT)\bin"
        # cc1.exe 住在 ...\lib\gcc\... 而不是 ...\bin —— mingw bin 不在 PATH 时它找不到自己的
        # libintl/libiconv/libgmp/libmpfr/libmpc/libzstd，gcc --version 能跑、一编译就 silently
        # exit 1（CI 实例）。机器学习包之前也踩过这个。GH 把 GITHUB_PATH 追加到后续步骤 PATH 的最前。

      - name: Report toolchain versions
        shell: pwsh
        run: |
          xmake --version
          clang-cl --version
          & "$env:MINGW_ROOT\bin\gcc.exe" --version | Select-Object -First 1

      - name: Preflight dependency check
        shell: pwsh
        run: pwsh -File configure.ps1

      - name: Configure
        shell: pwsh
        run: |
          # 版本在 configure 阶段临时覆盖：tag v1.2.3 → --app_version=1.2.3。
          # 它同时决定 exe 的版本资源与两个发布包的名字（xmake.lua 里默认 0.0.0）。
          # 版本资源是三个纯数字，所以 tag 必须是 vX.Y.Z 形态，这里先挡住不合规的。
          $version = '0.0.0'
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}' -replace '^v', ''
            if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "tag '${{ github.ref_name }}' must be vX.Y.Z (the version resource needs three plain numbers)"
            }
          }
          xmake f --yes -p windows -a x64 --toolchain=clang-cl --app_version=$version
          Write-Host "configured with version $version"

      - name: Build
        run: xmake build

      - name: Assert the version resources match the configured version
        shell: pwsh
        run: |
          # 覆盖没生效的话，包里就会是一个 0.0.0 的 exe —— 宁可在打包前就炸掉
          $want = '0.0.0'
          if ('${{ github.ref_type }}' -eq 'tag') { $want = '${{ github.ref_name }}' -replace '^v', '' }
          foreach ($exe in @('build\windows\x64\release\icemelt.exe',
                             'build\windows\x64\release\icemelt-gui.exe')) {
            $got = (Get-Item $exe).VersionInfo.FileVersion
            if ($got -ne $want) { throw "$exe reports version $got, expected $want" }
            Write-Host "OK: $exe -> $got"
          }

      - name: Assert the bundle is complete
        shell: pwsh
        run: |
          $out = 'build\windows\x64\release'
          $required = @(
            'icemelt.exe', 'icemelt-gui.exe', 'WinDisk_x64.sys', 'kdu.exe', 'drv64.dll', 'targets.txt',
            'tools\ntfscp.exe', 'tools\ntfsfix.exe', 'tools\ntfs-3g-cli.exe', 'tools\mkntfs.exe'
          )
          $missing = @($required | Where-Object { -not (Test-Path (Join-Path $out $_)) })
          if ($missing.Count) { throw "bundle incomplete, missing: $($missing -join ', ')" }
          Get-ChildItem $out -Recurse -File | Select-Object @{n = 'File'; e = { $_.FullName } },
              @{n = 'Bytes'; e = { $_.Length } } | Format-Table -AutoSize

      - name: "Smoke test (non-elevated: no driver load, no hive, no raw disk)"
        shell: pwsh
        run: |
          # --dump 是纯报告：非提权时驱动装载探测与 RegLoadKey 路径都不会被执行，
          # 因此在 runner 上也不可能碰到驱动或注册表 hive。
          $exe = 'build\windows\x64\release\icemelt.exe'
          & $exe --help | Out-String | Write-Host
          $dump = (& $exe --dump 2>&1 | Out-String)
          $dump | Write-Host
          if ($dump -notmatch 'IceMelt :: Melt') { throw 'dump did not print the report header' }
          if ($dump -notmatch 'state on this machine') { throw 'dump did not probe the target list' }
          # 退出码 = 自检是否全绿；runner 上必然有一条不绿（进程非提权），故只断言自检真的跑了
          if ($dump -notmatch 'CHECK FAILED|ALL SYSTEMS GO') { throw 'dump did not run the self-check' }

      - name: Assert Win7 floor for both frontends
        shell: pwsh
        run: |
          # Win7 SP1 是本项目的硬承诺：子系统版本必须 ≤ 6.01（icemelt 用链接器默认
          # 6.00，GUI 显式钉 6.01）。再断言没有 Win8+ 的静态导入 —— MSVC STL 的
          # std::filesystem "打开句柄" 路径会无条件链 CreateFile2，静默毁掉 Win7
          # 启动，这类回归不会以任何别的方式暴露。
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $dumpbin = (Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
                      Select-Object -First 1).FullName
          $bad = 'CreateFile2', 'GetTempPath2W', 'CopyFile2', 'GetSystemTimePreciseAsFileTime',
                 'SetThreadDescription', 'GetDpiForWindow'
          foreach ($exe in @('build\windows\x64\release\icemelt.exe',
                             'build\windows\x64\release\icemelt-gui.exe')) {
            $headers = (& $dumpbin /headers $exe | Out-String)
            if ($headers -notmatch '(6\.00|6\.01) subsystem version') {
              throw "$exe : subsystem version is not <= 6.01 (Win7 floor)"
            }
            $imports = (& $dumpbin /imports $exe | Out-String)
            foreach ($sym in $bad) {
              if ($imports -match "\b$sym\b") { throw "$exe : imports $sym (Win8+ API)" }
            }
            Write-Host "OK: $exe"
          }

      - name: Assert the driver cannot reset the machine
        shell: pwsh
        run: |
          # 本版移除了整条 bugcheck 路径，复位交给操作者：驱动不得再引用 KeBugCheckEx
          $sys = 'build\windows\x64\release\WinDisk_x64.sys'
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($sys))
          if ($text.Contains('KeBugCheckEx')) { throw "$sys still imports KeBugCheckEx" }

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          # 产物名跟着产品走（仓库已改名 IceMelt），tag 构建再带上版本号，
          # 这样从 Actions 页面下载时能分清是 main 的快照还是某个 release。
          # 这里是**未拆包的 release 目录**；两个可直接分发的 zip 见 Upload packages。
          name: IceMelt-windows-x64${{ github.ref_type == 'tag' && format('-{0}', github.ref_name) || '' }}
          path: build/windows/x64/release/**
          if-no-files-found: error

      - name: Package CLI / GUI bundles (xmake pack)
        shell: pwsh
        run: |
          # 两个包都由 xmake pack 出：内容取自 xmake.lua 里各 target 的安装文件清单
          # （见 install_runtime_assets），包名取 set_version —— 也就是上面覆盖过的版本。
          xmake pack -f zip -o dist

          $want = '0.0.0'
          if ('${{ github.ref_type }}' -eq 'tag') { $want = '${{ github.ref_name }}' -replace '^v', '' }
          $zips = @(Get-ChildItem dist/*.zip)
          if ($zips.Count -ne 2) { throw "expected 2 packages, got $($zips.Count)" }
          foreach ($zip in $zips) {
            if ($zip.Name -notmatch [regex]::Escape($want)) { throw "$($zip.Name) does not carry version $want" }
            Write-Host ("packaged {0} ({1:N1} MB)" -f $zip.Name, ($zip.Length / 1MB))
          }

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: IceMelt-packages${{ github.ref_type == 'tag' && format('-{0}', github.ref_name) || '' }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Create release draft (tag only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          # draft: true → push tag 后只建草稿，发布要人在网页上确认；
          # tag 已随 push 存在，这里只引用它，不会重复创建。
          draft: true
          tag_name: ${{ github.ref_name }}
          name: IceMelt ${{ github.ref_name }}
          # tag push 时 github.sha 就是该 tag 指向的 commit；body 在前，
          # generate_release_notes 的自动变更说明会追加到 body 之后。
          body: |
            Commit: `${{ github.sha }}`
          generate_release_notes: true
          files: dist/*.zip
